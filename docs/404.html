<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Opening passage…</title>
</head>
<body>
  <p>Opening the requested CTS passage…</p>
  <script>
    (function () {
      const ctsRoute = location.pathname.match(/^(.*\/quotes\/)urn:cts:greekLit:([^./:&]+)\.([^.:&/]+)(?:\.[^:&/]+)?(?::([^&/]+))?(?:&(.*))?$/);
      const shortRoute = location.pathname.match(/^(.*\/quotes\/([^/]+)\/)([^.&/]+)(?:\.([^&/]+))?(?:&(.*))?$/);
      const route = ctsRoute || shortRoute;
      if (!route) {
        document.body.textContent = "The requested page was not found.";
        return;
      }

      const quotesPrefix = ctsRoute ? route[1] : route[1].replace(/[^/]+\/$/, "");
      const siteRoot = quotesPrefix.replace(/quotes\/$/, "");
      const author = route[2];
      const work = route[3];
      const passage = route[4] || "";
      const query = route[5] || "";
      const params = new URLSearchParams(query);
      params.set("work", `${author}.${work}`);
      if (passage) params.set("passage", decodeURIComponent(passage));
      location.replace(`${siteRoot}viewer/?${params.toString()}`);
    }());
  </script>
</body>
</html>
